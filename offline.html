<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee9dc"><meta name="robots" content="noindex"><title>Hors connexion — Melaz</title><style>:root{color-scheme:light dark;--bg:light-dark(#eee9dc,#24231f);--ink:light-dark(#413c31,#eee9dc);--muted:light-dark(#746a58,#beb4a1)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 system-ui;min-height:100svh;display:grid;place-items:center;padding:calc(30px + env(safe-area-inset-top)) 30px calc(30px + env(safe-area-inset-bottom))}main{max-width:340px}h1{font:400 42px/1.05 Georgia,serif;letter-spacing:-1px;margin:0 0 24px}p{color:var(--muted);margin:0 0 28px}button{font:inherit;border:0;border-bottom:1px solid currentColor;padding:8px 0;background:transparent;color:inherit;cursor:pointer}:focus-visible{outline:2px solid currentColor;outline-offset:5px}</style></head><body><main><h1>On reprend<br>dans un instant.</h1><p>Tu es hors connexion. Retrouve internet pour accéder à tes projets et synchroniser tes données.</p><button id="retry" type="button">Réessayer →</button></main><script>document.getElementById('retry').addEventListener('click',()=>location.reload());</script></body></html>
